<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciri</title>
    <link rel="stylesheet" href="/static/style.css?v=1.13">
    <link rel="stylesheet" href="/static/mobile.css?v=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- Markdown Support -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header" style="padding-bottom: 0;">
                <button class="menu-btn"><span class="material-symbols-outlined">menu</span></button>
            </div>
            <button class="new-chat-btn">
                <span class="material-symbols-outlined">add</span>
                <span>发起新对话</span>
            </button>

            <div class="nav-section">

                <div class="nav-item">
                    <span class="material-symbols-outlined">explore</span>
                    <span>探索 Gem</span>
                </div>
            </div>

            <div class="recent-chats">
                <div class="recent-title">近期对话</div>
                <!-- 会话列表将由 JavaScript 动态加载 -->
            </div>

            <div class="sidebar-footer">
                <div class="nav-item" id="kairosBtn">
                    <span class="material-symbols-outlined">schedule</span>
                    <span>KAIROS</span>
                </div>
                <div class="nav-item">
                    <span class="material-symbols-outlined">help</span>
                    <span>帮助</span>
                </div>
                <div class="nav-item">
                    <span class="material-symbols-outlined">history</span>
                    <span>活动</span>
                </div>
                <div class="nav-item" id="settingsBtn">
                    <span class="material-symbols-outlined">settings</span>
                    <span>设置</span>
                </div>
            </div>
            <!-- Resize Handle -->
            <div class="resize-handle"></div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="top-bar">
                <!-- 手机端汉堡菜单按钮 (仅在手机上显示) -->
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <div class="model-selector">
                    <span>Ciri</span>
                    <span class="material-symbols-outlined">arrow_drop_down</span>
                </div>
                <!-- 用户切换器 (用于测试多用户隔离) -->
                <div class="model-selector" style="margin-left: auto; margin-right: 16px;">
                    <select id="userSelector"
                        style="background: transparent; border: 1px solid #dadce0; border-radius: 8px; padding: 6px 12px; font-size: 14px; cursor: pointer;">
                        <option value="user_001">用户 001 (默认)</option>
                        <option value="user_A">用户 A</option>
                        <option value="user_B">用户 B</option>
                        <option value="user_C">用户 C</option>
                        <option value="custom">自定义 (输入名字)...</option>
                    </select>
                </div>
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>

            <div class="chat-container" id="chatContainer">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="greeting">
                        <span class="gradient-text">你好, User</span>
                    </div>
                    <div class="sub-greeting">需要我为你做些什么？</div>
                </div>

                <!-- Chat Messages will be inserted here -->
            </div>

            <div class="input-area-wrapper">
                <div class="input-area">
                    <div id="imagePreviewContainer" class="image-preview-container"></div>
                    <div class="input-row">
                        <button class="icon-btn" id="uploadBtn"><span
                                class="material-symbols-outlined">add_circle</span></button>
                        <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
                        <textarea id="userInput" placeholder="问问 Ciri" rows="1"></textarea>
                        <button class="icon-btn" id="micBtn"><span class="material-symbols-outlined">mic</span></button>
                        <button class="icon-btn" id="sendBtn"><span
                                class="material-symbols-outlined">send</span></button>
                        <button class="icon-btn" id="stopBtn" style="display: none;" title="停止生成"><span
                                class="material-symbols-outlined">stop_circle</span></button>
                    </div>
                </div>
                <div class="disclaimer">
                    Ciri 的回答未必准确无误，请注意核查。
                </div>
            </div>
        </main>
    </div>
    <!-- 手机端侧边栏遮罩 -->
    <div class="mobile-overlay" id="mobileOverlay"></div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>系统设置</h2>
                <button class="close-btn" id="closeSettings">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label>模型预设 (Presets)</label>
                    <select id="modelPreset">
                        <option value="custom">-- 手动输入 --</option>
                        <option value="gpt-4o">GPT-4o (OpenAI)</option>
                        <option value="claude-3-5-sonnet-20241022">Claude 3.5 Sonnet</option>
                        <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                        <option value="deepseek-chat">DeepSeek V3</option>
                        <option value="deepseek-reasoner">DeepSeek R1 (Reasoner)</option>
                        <option value="qwen-plus">Qwen Plus</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>模型名称 (Model)</label>
                    <input type="text" id="settingModel" placeholder="例如: gpt-4o">
                </div>
                <div class="setting-group">
                    <label>API 代理地址 (Base URL)</label>
                    <input type="text" id="settingApiBase" placeholder="https://api.openai.com/v1">
                </div>
                <div class="setting-group">
                    <label>API 密钥 (API Key)</label>
                    <input type="password" id="settingApiKey" placeholder="sk-...">
                    <small style="color: #666; font-size: 11px;">如果不修改，请留空。后端将维持现有配置。</small>
                </div>
            </div>
            <div class="modal-footer">
                <button class="secondary-btn" id="cancelSettings">取消</button>
                <button class="primary-btn" id="saveSettingsBtn">保存并应用</button>
            </div>
        </div>
    </div>

    <!-- KAIROS Modal -->
    <div id="kairosModal" class="modal-overlay">
        <div class="modal-content kairos-modal" style="max-width: 1280px;">
            <div class="modal-header kairos-modal-header">
                <h2>KAIROS 自主运行时</h2>
                <button class="close-btn" id="closeKairos">&times;</button>
            </div>
            <div class="modal-body kairos-modal-body" id="kairosBody">
                <div id="kairosNoSession" style="color:#666; text-align:center; padding:20px;">
                    请先选择或创建一个对话，然后再管理 KAIROS。
                </div>
                <div id="kairosPanel" style="display:none;">
                    <div id="kairosConsole" class="kairos-console">
                        <div id="kairosLiveColumn" class="kairos-column kairos-column-live">
                            <div id="kairosOverviewCard" class="setting-group kairos-card">
                                <label>Runtime Overview</label>
                            </div>
                            <div id="kairosControlsCard" class="setting-group kairos-card kairos-controls-row">
                                <button class="primary-btn" id="kairosStartBtn">启动</button>
                                <button class="secondary-btn" id="kairosStopBtn">停止</button>
                                <button class="secondary-btn" id="kairosWakeBtn">唤醒</button>
                                <button class="secondary-btn" id="kairosRefreshBtn">刷新状态</button>
                            </div>
                            <!-- Status -->
                            <div class="setting-group kairos-card">
                                <label>运行状态</label>
                                <div id="kairosStatus" style="font-size:13px; color:#444; padding:8px; background:#f8f9fa; border-radius:6px; max-height:200px; overflow-y:auto; font-family:monospace; white-space:pre-wrap;">加载中...</div>
                            </div>
                            <!-- Wake reason -->
                            <div class="setting-group kairos-card">
                                <label>唤醒原因</label>
                                <input type="text" id="kairosWakeReason" placeholder="manual_smoke" value="manual_smoke">
                            </div>
                            <!-- Dex Handoff -->
                            <div class="setting-group kairos-card">
                                <label>注册 Dex Handoff</label>
                                <div style="display:flex; gap:6px;">
                                    <input type="text" id="kairosDexTaskId" placeholder="task_id" style="flex:1;">
                                    <input type="text" id="kairosDexDesc" placeholder="description" style="flex:1;">
                                    <button class="primary-btn" id="kairosDexRegBtn">注册</button>
                                </div>
                            </div>
                            <!-- Workflow -->
                            <div class="setting-group kairos-card">
                                <label>Active Workflow</label>
                                <div id="kairosWorkflow" style="font-size:12px; color:#555; padding:8px; background:#f8f9fa; border-radius:6px; max-height:220px; overflow-y:auto; font-family:monospace; white-space:pre-wrap;">无</div>
                            </div>
                            <!-- Planned Actions -->
                            <div class="setting-group kairos-card">
                                <label>Planned Actions</label>
                                <div id="kairosPlannedActions" style="font-size:12px; color:#555; padding:8px; background:#f8f9fa; border-radius:6px; max-height:220px; overflow-y:auto; font-family:monospace; white-space:pre-wrap;">无</div>
                            </div>
                            <!-- Blocked Reason -->
                            <div class="setting-group kairos-card">
                                <label>Blocked Reason</label>
                                <div id="kairosBlockedReason" style="font-size:12px; color:#555; padding:8px; background:#f8f9fa; border-radius:6px; max-height:120px; overflow-y:auto; font-family:monospace; white-space:pre-wrap;">无</div>
                            </div>
                            <!-- Result Summary -->
                            <div class="setting-group kairos-card">
                                <label>Result Summary</label>
                                <div id="kairosResultSummary" style="font-size:12px; color:#555; padding:8px; background:#f8f9fa; border-radius:6px; max-height:220px; overflow-y:auto; font-family:monospace; white-space:pre-wrap;">无</div>
                            </div>
                            <!-- Unfinished Work -->
                            <div class="setting-group kairos-card">
                                <label>Unfinished Work</label>
                                <div id="kairosUnfinishedWork" style="font-size:12px; color:#555; padding:8px; background:#f8f9fa; border-radius:6px; max-height:200px; overflow-y:auto; font-family:monospace; white-space:pre-wrap;">无</div>
                            </div>
                            <!-- Proactive Candidates -->
                            <div class="setting-group kairos-card">
                                <label>Proactive Candidates</label>
                                <div id="kairosProactiveCandidates" style="font-size:12px; color:#555; padding:8px; background:#f8f9fa; border-radius:6px; max-height:200px; overflow-y:auto; font-family:monospace; white-space:pre-wrap;">无</div>
                            </div>
                            <!-- Guardrail State -->
                            <div class="setting-group kairos-card">
                                <label>Guardrail State</label>
                                <div id="kairosGuardrailState" style="font-size:12px; color:#555; padding:8px; background:#f8f9fa; border-radius:6px; max-height:220px; overflow-y:auto; font-family:monospace; white-space:pre-wrap;">无</div>
                            </div>
                            <!-- Planning Winner -->
                            <div class="setting-group kairos-card kairos-planning-card">
                                <label>Planning Winner</label>
                                <div id="kairosPlanningWinner" class="kairos-planning-list">无</div>
                            </div>
                            <!-- Planning Rejected -->
                            <div class="setting-group kairos-card kairos-planning-card">
                                <label>Planning Rejected</label>
                                <div id="kairosPlanningRejected" class="kairos-planning-list">无</div>
                            </div>
                            <!-- Planning Re-plan -->
                            <div class="setting-group kairos-card kairos-planning-card">
                                <label>Planning Re-plan</label>
                                <div id="kairosPlanningReplan" class="kairos-planning-list">无</div>
                            </div>
                            <!-- Tracked Dex Tasks -->
                            <div class="setting-group kairos-card">
                                <label>Tracked Dex Tasks</label>
                                <div id="kairosTrackedDexTasks" style="font-size:12px; color:#555; padding:8px; background:#f8f9fa; border-radius:6px; max-height:220px; overflow-y:auto; font-family:monospace; white-space:pre-wrap;">无</div>
                            </div>
                            <!-- Events -->
                            <div class="setting-group kairos-card">
                                <label>最近事件</label>
                                <div id="kairosEvents" style="font-size:12px; color:#555; padding:8px; background:#f8f9fa; border-radius:6px; max-height:200px; overflow-y:auto; font-family:monospace; white-space:pre-wrap;">无</div>
                            </div>
                        </div>
                        <div id="kairosHistoryColumn" class="kairos-column kairos-column-history">
                            <div class="setting-group kairos-card kairos-right-rail-card">
                                <label>注册 Cron Schedule</label>
                                <div style="display:flex; gap:6px; flex-wrap:wrap;">
                                    <input type="text" id="kairosSchedId" placeholder="schedule_id" value="morning" style="flex:1; min-width:100px;">
                                    <input type="text" id="kairosSchedCron" placeholder="cron 表达式" value="*/5 * * * *" style="flex:1; min-width:120px;">
                                    <input type="text" id="kairosSchedReason" placeholder="reason" value="morning_checkin" style="flex:1; min-width:100px;">
                                </div>
                                <div style="margin-top:6px; display:flex; gap:6px;">
                                    <button class="primary-btn" id="kairosAddSchedBtn">添加 Schedule</button>
                                    <button class="secondary-btn" id="kairosDelSchedBtn">删除 Schedule</button>
                                </div>
                            </div>
                            <div class="setting-group kairos-card">
                                <label>History Timeline</label>
                                <div id="kairosHistoryTimeline" class="kairos-timeline">
                                    <div class="kairos-timeline-item">
                                        <div class="kairos-timeline-dot"></div>
                                        <div class="kairos-timeline-content">加载中...</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/script.js?v=1.16"></script>
    <!-- Skill Dropdown (fixed, positioned by JS) -->
    <div id="skillDropdown" class="skill-dropdown" style="display:none;"></div>
</body>

</html>
